name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build GameStreamX.slnx -c Release --nologo
      # Unit tests only: the integration tests mount real drives and need WinFsp + rclone (see TEST_REPORT.md).
      - name: Unit tests
        run: dotnet test tests/GameStreamX.Tests -c Release --no-build --nologo
